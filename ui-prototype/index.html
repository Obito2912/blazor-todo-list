<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Quest UI Prototype</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#" aria-label="My Quest home">
        <span class="brand-mark" aria-hidden="true">✓</span>
        <span>My Quest</span>
      </a>

      <nav class="nav" aria-label="Main navigation">
        <button class="nav-item" type="button" data-nav="Dashboard"><span>⌂</span> Dashboard</button>
        <button class="nav-item active" type="button" data-nav="My Tasks"><span>▣</span> My Tasks</button>
        <button class="nav-item" type="button" data-nav="Completed"><span>✓</span> Completed</button>
        <button class="nav-item" type="button" data-nav="Profile"><span>○</span> Profile</button>
      </nav>

      <div class="profile-card">
        <span class="avatar">NF</span>
        <span class="profile-copy"><strong>Nyantakyi Francis</strong><small>francis@example.com</small></span>
        <button class="icon-button" type="button" aria-label="Open profile menu">⌄</button>
      </div>
    </aside>

    <main class="main-content">
      <header class="page-header">
        <div class="page-title-row">
          <button class="menu-button" id="menuButton" type="button" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">☰</button>
          <div><p class="eyebrow">Friday, July 17</p><h1>My Tasks</h1></div>
        </div>
        <button class="primary-button" id="addTaskButton" type="button"><span>＋</span> Add Task</button>
      </header>

      <section class="toolbar" aria-label="Task controls">
        <label class="search-field">
          <span aria-hidden="true">⌕</span>
          <span class="sr-only">Search tasks</span>
          <input id="searchInput" type="search" placeholder="Search tasks">
        </label>
        <div class="filters" role="group" aria-label="Filter tasks by status">
          <button class="filter-button active" type="button" data-filter="all">All <span id="allCount">0</span></button>
          <button class="filter-button" type="button" data-filter="pending">Pending <span id="pendingCount">0</span></button>
          <button class="filter-button" type="button" data-filter="completed">Completed <span id="completedCount">0</span></button>
        </div>
      </section>

      <section class="task-panel" aria-live="polite">
        <div class="task-panel-heading"><h2>Today’s focus</h2><p id="resultSummary"></p></div>
        <div class="loading-state" id="loadingState"><span class="spinner"></span><p>Loading your tasks…</p></div>
        <div class="task-list" id="taskList"></div>
        <div class="empty-state" id="emptyState" hidden>
          <span class="empty-icon">✓</span>
          <h2>No tasks found</h2>
          <p>Try another filter or add a new task to your list.</p>
          <button class="secondary-button" id="emptyAddButton" type="button">Add your first task</button>
        </div>
      </section>
    </main>
  </div>

  <div class="mobile-overlay" id="mobileOverlay"></div>

  <dialog class="task-dialog" id="taskDialog">
    <form id="taskForm" novalidate>
      <div class="dialog-heading">
        <div><p class="eyebrow" id="dialogEyebrow">New quest</p><h2 id="dialogTitle">Add Task</h2></div>
        <button class="icon-button close-button" id="closeDialogButton" type="button" aria-label="Close">×</button>
      </div>
      <input id="taskId" type="hidden">
      <label>Title <span aria-hidden="true">*</span><input id="taskTitle" name="title" maxlength="80" required placeholder="What needs to be done?"></label>
      <p class="field-error" id="titleError"></p>
      <label>Description<textarea id="taskDescription" name="description" rows="4" maxlength="240" placeholder="Add a few helpful details"></textarea></label>
      <label>Due date<input id="taskDueDate" name="dueDate" type="date" required></label>
      <p class="field-error" id="dateError"></p>
      <div class="dialog-actions">
        <button class="secondary-button" id="cancelDialogButton" type="button">Cancel</button>
        <button class="primary-button" type="submit">Save Task</button>
      </div>
    </form>
  </dialog>

  <dialog class="confirm-dialog" id="deleteDialog">
    <div class="danger-mark">!</div>
    <h2>Delete this task?</h2>
    <p>This action cannot be undone.</p>
    <div class="dialog-actions">
      <button class="secondary-button" id="cancelDeleteButton" type="button">Cancel</button>
      <button class="danger-button" id="confirmDeleteButton" type="button">Delete Task</button>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
